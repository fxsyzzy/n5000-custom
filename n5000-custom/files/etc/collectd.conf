BaseDir "/var/run/collectd"
PIDFile "/var/run/collectd.pid"
PluginDir "/usr/lib/collectd"
TypesDB "/usr/share/collectd/types.db"
Interval 30
ReadThreads 2

LoadPlugin cpu
LoadPlugin load
LoadPlugin memory
LoadPlugin df
LoadPlugin interface
LoadPlugin iwinfo
LoadPlugin rrdtool

<Plugin df>
	ReportByDevice false
</Plugin>

<Plugin interface>
	Interface "eth0"
	Interface "eth1"
	Interface "br-lan"
</Plugin>

<Plugin rrdtool>
	DataDir "/srv/rrd"
	CreateFilesAsync false
	CacheTimeout 120
	CacheFlush 900
	RRARows 288
	RRATimespan 7200
	RRATimespan 86400
	RRATimespan 604800
	RRATimespan 2592000
	RRATimespan 31536000
</Plugin>
