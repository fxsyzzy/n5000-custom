<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N5000 应用过滤</title>
<style>
  :root{--text:#e8eefb;--dim:rgba(232,238,251,.55);--card:rgba(255,255,255,.045);--border:rgba(255,255,255,.085);
    --accent:#4C7DFF;--accent2:#7FA8FF;--warn:#ffc46b;--bad:#ff7f9c;--radius:16px}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:radial-gradient(1100px 520px at 18% -12%,rgba(0,47,167,.30),transparent 60%),
      radial-gradient(900px 480px at 88% -8%,rgba(43,91,232,.20),transparent 58%),
      linear-gradient(180deg,#070b12 0%,#0a1019 55%,#080b11 100%)}
  .wrap{max-width:1680px;margin:0 auto;padding:20px 26px;display:flex;flex-direction:column;gap:16px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:2px 2px 14px;border-bottom:1px solid var(--border)}
  header h1{font-size:17px;margin:0;font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:6px}
  .dot.off{background:var(--bad)}
  .sub{color:var(--dim);font-size:12.5px}
  .spacer{flex:1}
  .hbtn{color:var(--text);text-decoration:none;font-size:12.5px;padding:6px 13px;border-radius:8px;border:1px solid var(--border);
    background:rgba(255,255,255,.03);cursor:pointer;font-family:inherit}
  .hbtn:hover{background:rgba(255,255,255,.07)}
  .hbtn.on{color:var(--accent);border-color:rgba(76,125,255,.4);background:rgba(76,125,255,.10)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.028));border:1px solid var(--border);
    border-radius:var(--radius);padding:16px 18px}
  .label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
  .big{font-size:28px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
  .cols{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
  .sec-title{font-size:13px;font-weight:600;margin:0 0 10px;color:var(--text)}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
  .bar-row .name{width:96px;color:var(--dim);flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:3px}
  .bar-row .val{width:86px;text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
  .dev-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
  .dev-row:last-child{border-bottom:none}
  .dev-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dev-ip{color:var(--dim);font-size:11.5px;width:120px}
  .dev-total{width:90px;text-align:right;font-variant-numeric:tabular-nums}
  .mini-btn{font-size:11.5px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.04);
    color:var(--text);cursor:pointer;font-family:inherit}
  .mini-btn:hover{background:rgba(255,255,255,.09)}
  .mini-btn.on{color:var(--accent);border-color:rgba(76,125,255,.4)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    padding:8px 10px;border-bottom:1px solid var(--border)}
  td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.05);font-variant-numeric:tabular-nums}
  tr:hover td{background:rgba(255,255,255,.025)}
  .tag{font-size:11px;padding:2px 8px;border-radius:5px;background:rgba(76,125,255,.12);color:var(--accent2)}
  .scroll{max-height:380px;overflow:auto}
  .scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
  /* modal */
  .mask{position:fixed;inset:0;background:rgba(4,8,14,.6);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
  .mask.on{display:flex}
  .panel{width:min(640px,96vw);max-height:88vh;overflow:auto;border-radius:20px;padding:22px;background:#0d1421;
    border:1px solid var(--border);box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .panel h2{margin:0 0 14px;font-size:15px}
  .row{margin-bottom:14px}
  .row label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
  .row input[type=text],.row input[type=time],.row textarea{width:100%;background:rgba(255,255,255,.045);
    border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;padding:9px 12px}
  .row textarea{min-height:64px;resize:vertical}
  .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .cats label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text);margin:0;
    background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:7px 10px;cursor:pointer}
  .cats input{accent-color:#4C7DFF}
  .days{display:flex;gap:6px;flex-wrap:wrap}
  .days button{border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--dim);border-radius:6px;
    padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
  .days button.on{background:rgba(76,125,255,.16);border-color:rgba(76,125,255,.4);color:var(--accent2)}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .actions button{border-radius:8px;padding:9px 18px;font-family:inherit;font-size:13px;cursor:pointer;
    border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text)}
  .actions button.primary{border:none;color:#04122b;font-weight:600;
    background:linear-gradient(120deg,#8FB0FF,#4C7DFF 45%,#2B5BE8)}
  .hint{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:6px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);padding:9px 18px;border-radius:8px;
    background:#0f1a24;border:1px solid var(--border);font-size:13px;display:none;z-index:30}
  .toast.on{display:block}
  @media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
  @media(max-width:600px){.wrap{padding:12px}.stats{grid-template-columns:1fr 1fr}.cats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>应用过滤 <span class="sub">/ Traffic &amp; App Filter</span></h1>
    <span class="sub"><span class="dot" id="liveDot"></span><span id="upText">--</span></span>
    <span class="spacer"></span>

    <button class="hbtn" id="btnBlock" title="启用/停用拦截">拦截: --</button>
    <button class="hbtn" id="btnReset">清空统计</button>
    <button class="hbtn" id="lang">EN</button>
    <a class="hbtn" href="/dashboard.html">返回仪表盘</a>
  </header>

  <div class="stats">
    <div class="card"><div class="label" data-i18n="total">总流量</div><div class="big" id="sTotal">--</div><div class="sub" id="sTotalNote">本次开机以来</div></div>
    <div class="card"><div class="label" data-i18n="clients">在线设备（有流量）</div><div class="big" id="sDevs">--</div></div>
    <div class="card"><div class="label" data-i18n="apps">识别网站/应用</div><div class="big" id="sSites">--</div></div>
    <div class="card"><div class="label" data-i18n="filtered">正在管控设备</div><div class="big" id="sRules">--</div></div>
  </div>

  <div class="cols">
    <div class="card">
      <div class="sec-title" data-i18n="byCat">分类流量</div>
      <div id="catBars"><div class="sub">加载中…</div></div>
    </div>
    <div class="card">
      <div class="sec-title" data-i18n="byDev">设备流量</div>
      <div id="devList"><div class="sub">加载中…</div></div>
    </div>
  </div>

  <div class="card">
    <div class="sec-title" data-i18n="siteTable">网站流量明细（按流量排序）</div>
    <div class="scroll">
      <table>
        <thead><tr>
          <th data-i18n="site">网站 / 域名</th><th data-i18n="cat">分类</th>
          <th data-i18n="dev">设备</th><th data-i18n="traffic">流量</th>
        </tr></thead>
        <tbody id="siteBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 规则编辑 -->
<div class="mask" id="mask">
  <div class="panel">
    <h2 id="ruleTitle">设备管控</h2>
    <div class="row">
      <label data-i18n="blockCats">禁止分类（勾选后该设备无法访问）</label>
      <div class="cats" id="catChecks"></div>
    </div>
    <div class="row">
      <label data-i18n="blockDoms">额外禁止域名（逗号分隔，如 douyin.com,bilibili.com）</label>
      <input type="text" id="domsInput" placeholder="douyin.com,qq.com">
    </div>
    <div class="row">
      <label data-i18n="schedule">生效时间段（留空=全天）</label>
      <div style="display:flex;gap:10px;align-items:center">
        <input type="time" id="stTime" style="width:auto">
        <span class="sub">—</span>
        <input type="time" id="etTime" style="width:auto">
      </div>
      <div class="days" id="dayBtns" style="margin-top:8px"></div>
      <div class="hint">未选星期=每天生效</div>
    </div>
    <div class="actions">
      <button id="btnDelete" data-i18n="remove">删除规则</button>
      <button id="btnCancel" data-i18n="cancel">取消</button>
      <button class="primary" id="btnSave" data-i18n="save">保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var T={
    zh:{total:"总流量",clients:"在线设备（有流量）",apps:"识别网站/应用",filtered:"正在管控设备",byCat:"分类流量",
      byDev:"设备流量",siteTable:"网站流量明细（按流量排序）",site:"网站 / 域名",cat:"分类",dev:"设备",traffic:"流量",
      blockCats:"禁止分类（勾选后该设备无法访问）",blockDoms:"额外禁止域名（逗号分隔，如 douyin.com,bilibili.com）",
      schedule:"生效时间段（留空=全天）",remove:"删除规则",cancel:"取消",save:"保存",manage:"管控",
      enable:"启用拦截",disable:"停用拦截",clear:"清空统计",none:"暂无数据"},
    en:{total:"Total traffic",clients:"Active devices",apps:"Sites detected",filtered:"Devices filtered",byCat:"Traffic by category",
      byDev:"Traffic by device",siteTable:"Site traffic details",site:"Site / domain",cat:"Category",dev:"Device",traffic:"Traffic",
      blockCats:"Blocked categories",blockDoms:"Extra blocked domains (comma separated)",
      schedule:"Active window (empty = all day)",remove:"Remove rule",cancel:"Cancel",save:"Save",manage:"Manage",
      enable:"Enable filter",disable:"Disable filter",clear:"Clear stats",none:"No data"}
  };
  var lang=localStorage.getItem('n5000-appfilter-lang')|| (navigator.language&&navigator.language.indexOf('zh')===0?'zh':'en');
  function t(k){return (T[lang]&&T[lang][k])||T.zh[k]||k}
  function applyLang(){
    document.documentElement.lang=lang==='zh'?'zh-CN':'en';
    $('lang').textContent=lang==='zh'?'EN':'中';
    document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.getAttribute('data-i18n'))});
  }
  function fmt(b){
    b=Number(b)||0;
    if(b>1099511627776)return (b/1099511627776).toFixed(2)+' TB';
    if(b>1073741824)return (b/1073741824).toFixed(2)+' GB';
    if(b>1048576)return (b/1048576).toFixed(1)+' MB';
    if(b>1024)return (b/1024).toFixed(0)+' KB';
    return b+' B';
  }
  function toast(m){var el=$('toast');el.textContent=m;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('on')},2000)}
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}

  var state=null, cats=[], editing=null, daysSel=[];

  function loadCats(){
    return fetch('/cgi-bin/appfilter?action=cats',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
      cats=j||[];
      $('catChecks').innerHTML=cats.map(function(c){
        return '<label><input type="checkbox" value="'+esc(c.key)+'"> '+esc(c.name)+'</label>';
      }).join('');
    }).catch(function(){});
  }

  function catName(k){
    for(var i=0;i<cats.length;i++) if(cats[i].key===k) return cats[i].name;
    return k==='unknown'?'未识别':(k==='other'?'其他':k);
  }

  function load(){
    fetch('/cgi-bin/appfilter?action=state&t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
      state=j;
      $('liveDot').className='dot'+(j.enabled?'':' off');
      $('upText').textContent='开机 '+(j.uptime||0)+' 秒';
      $('btnBlock').textContent=(j.block_enabled?t('disable'):t('enable'));
      $('btnBlock').classList.toggle('on',!!j.block_enabled);
      var devs=j.devices||[], tot=0, sites={};
      devs.forEach(function(d){tot+=d.total||0;(d.sites||[]).forEach(function(s){sites[s.domain]=(sites[s.domain]||0)+s.bytes})});
      $('sTotal').textContent=fmt(tot);
      $('sDevs').textContent=devs.length;
      $('sSites').textContent=Object.keys(sites).length;
      $('sRules').textContent=(j.rules||[]).length;
      // 分类柱状
      var c=j.categories||[], max=1; c.forEach(function(x){max=Math.max(max,x.bytes)});
      $('catBars').innerHTML = c.length ? c.map(function(x){
        return '<div class="bar-row"><div class="name">'+esc(catName(x.cat))+'</div>'+
          '<div class="bar"><i style="width:'+Math.round((x.bytes/max)*100)+'%"></i></div>'+
          '<div class="val">'+fmt(x.bytes)+'</div></div>';
      }).join('') : '<div class="sub">'+t('none')+'</div>';
      // 设备列表
      $('devList').innerHTML = devs.length ? devs.map(function(d){
        var ip='';
        (j.leases||[]).forEach(function(l){if(l.mac===d.mac) ip=l.name||''});
        return '<div class="dev-row"><div class="dev-name">'+esc(d.name||d.mac)+'</div>'+
          '<div class="dev-total">'+fmt(d.total)+'</div>'+
          '<button class="mini-btn" data-mac="'+esc(d.mac)+'">'+t('manage')+'</button></div>';
      }).join('') : '<div class="sub">'+t('none')+'</div>';
      $('devList').querySelectorAll('button[data-mac]').forEach(function(b){
        b.onclick=function(){ openRule(b.getAttribute('data-mac')) };
      });
      // 网站明细
      var rows=[];
      devs.forEach(function(d){(d.sites||[]).forEach(function(s){rows.push({domain:s.domain,cat:s.cat,dev:d.name||d.mac,bytes:s.bytes})})});
      var agg={};
      rows.forEach(function(r){ var k=r.domain; if(!agg[k])agg[k]={domain:k,cat:r.cat,devs:{},bytes:0}; agg[k].bytes+=r.bytes; agg[k].devs[r.dev]=1; });
      var list=Object.keys(agg).map(function(k){var a=agg[k];return{domain:a.domain,cat:a.cat,dev:Object.keys(a.devs).join(', '),bytes:a.bytes}});
      list.sort(function(a,b){return b.bytes-a.bytes});
      $('siteBody').innerHTML=list.slice(0,200).map(function(r){
        return '<tr><td>'+esc(r.domain)+'</td><td><span class="tag">'+esc(catName(r.cat))+'</span></td>'+
          '<td class="sub">'+esc(r.dev)+'</td><td>'+fmt(r.bytes)+'</td></tr>';
      }).join('') || '<tr><td colspan="4" class="sub">'+t('none')+'</td></tr>';
      // 刷新规则列表（设备按钮状态）
    }).catch(function(){});
  }

  function openRule(mac){
    editing=mac||null;
    var rule=null;
    (state&&state.rules||[]).forEach(function(r){if(r.mac===mac)rule=r});
    $('ruleTitle').textContent=(rule&&rule.name?rule.name+' ':'')+'设备管控';
    $('domsInput').value=rule?rule.block_domains||'':'';
    $('stTime').value=rule&&rule.schedule_start?rule.schedule_start:'';
    $('etTime').value=rule&&rule.schedule_end?rule.schedule_end:'';
    daysSel=rule&&rule.schedule_days?rule.schedule_days.split(',').filter(Boolean).map(Number):[];
    var selCats=(rule&&rule.block_cats?rule.block_cats.split(','):[]);
    $('catChecks').querySelectorAll('input').forEach(function(cb){cb.checked=selCats.indexOf(cb.value)>=0});
    renderDays();
    $('mask').classList.add('on');
  }
  function renderDays(){
    var names=['一','二','三','四','五','六','日'];
    $('dayBtns').innerHTML=names.map(function(n,i){
      var d=i+1;
      return '<button data-d="'+d+'" class="'+(daysSel.indexOf(d)>=0?'on':'')+'">周'+n+'</button>';
    }).join('');
    $('dayBtns').querySelectorAll('button').forEach(function(b){
      b.onclick=function(){
        var d=Number(b.getAttribute('data-d'));
        var i=daysSel.indexOf(d);
        if(i>=0)daysSel.splice(i,1);else daysSel.push(d);
        renderDays();
      };
    });
  }
  function saveRule(){
    if(!state) return;
    var rules=(state.rules||[]).slice();
    var mac=editing;
    if(!mac){ toast('请选择设备'); return; }
    var name=mac;
    (state.leases||[]).forEach(function(l){if(l.mac===mac&&l.name)name=l.name});
    var catsSel=[];
    $('catChecks').querySelectorAll('input:checked').forEach(function(cb){catsSel.push(cb.value)});
    var rule={mac:mac,name:name,block_cats:catsSel.join(','),block_domains:$('domsInput').value.trim(),
      schedule_start:$('stTime').value,schedule_end:$('etTime').value,schedule_days:daysSel.join(',')};
    var found=false;
    for(var i=0;i<rules.length;i++){if(rules[i].mac===mac){rules[i]=rule;found=true}}
    if(!found)rules.push(rule);
    post({devices:rules},function(){
      $('mask').classList.remove('on');toast(t('save'));load();
    });
  }
  function deleteRule(){
    if(!state||!editing)return;
    var rules=(state.rules||[]).filter(function(r){return r.mac!==editing});
    post({devices:rules},function(){$('mask').classList.remove('on');toast(t('remove'));load()});
  }
  function post(data,cb){
    fetch('/cgi-bin/appfilter?action=save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
      .then(function(r){return r.json()}).then(function(j){if(j.code===0&&cb)cb();else toast('保存失败')}).catch(function(){toast('保存失败')});
  }

  $('lang').onclick=function(){lang=lang==='zh'?'en':'zh';localStorage.setItem('n5000-appfilter-lang',lang);applyLang();if(state)load()};
  $('btnBlock').onclick=function(){
    if(!state)return;
    var v=!state.block_enabled;
    fetch('/cgi-bin/appfilter?action=save',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({global:{block_enabled:v,enabled:state.enabled},devices:state.rules||[]})})
      .then(function(r){return r.json()}).then(function(){load()});
  };
  $('btnReset').onclick=function(){
    if(!confirm(lang==='zh'?'清空本次统计？':'Clear stats?'))return;
    fetch('/cgi-bin/appfilter?action=reset',{method:'POST'}).then(function(){toast(t('clear'));load()});
  };
  $('btnCancel').onclick=function(){$('mask').classList.remove('on')};
  $('btnSave').onclick=saveRule;
  $('btnDelete').onclick=deleteRule;

  applyLang();
  loadCats();
  load();
  setInterval(load,5000);
})();
</script>
</body>
</html>
