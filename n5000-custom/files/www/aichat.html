<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>N5000 AI</title>
<style>
  :root{--bg:#070b10;--card:#0f1620;--line:#1d2a3a;--text:#e6f1ff;--dim:#7f8fa6;--green:#33ff9e;--cyan:#38d9ff;--orange:#ffb020;--red:#ff5c5c}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Consolas","Microsoft YaHei",ui-monospace,monospace}
  .wrap{height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:18px;margin:0;color:var(--green);letter-spacing:1px;text-shadow:0 0 10px rgba(51,255,158,.35)}
  .badge{font-size:12px;color:var(--dim);border:1px solid var(--line);padding:2px 8px;border-radius:4px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px}
  .dot.off{background:var(--red)}
  header .spacer{flex:1}
  button{background:transparent;border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:13px;
    padding:4px 10px;border-radius:4px;cursor:pointer}
  button:hover{border-color:var(--green);color:var(--green)}
  button.primary{background:var(--green);color:#04120b;border-color:var(--green);font-weight:700}
  button.primary:hover{filter:brightness(1.1);color:#04120b}
  button:disabled{opacity:.45;cursor:not-allowed}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{display:flex;gap:10px;max-width:min(860px,92%)}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .avatar{width:30px;height:30px;border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:14px;border:1px solid var(--line);background:var(--card)}
  .msg.ai .avatar{color:var(--green);border-color:rgba(51,255,158,.4)}
  .msg.me .avatar{color:var(--cyan)}
  .bubble{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .msg.me .bubble{border-color:rgba(56,217,255,.35)}
  .meta{font-size:11px;color:var(--dim);margin-top:4px}
  .inputbar{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);align-items:flex-end}
  #input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:14px;
    border-radius:8px;padding:10px 12px;resize:none;min-height:44px;max-height:140px;line-height:1.4}
  #input:focus{outline:none;border-color:var(--green)}
  #send{height:44px;padding:0 18px}
  .typing{font-size:13px;color:var(--dim);padding:0 16px 8px;display:none}
  .typing.on{display:block}
  /* modal */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
  .mask.on{display:flex}
  .panel{width:min(720px,96vw);max-height:88vh;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
  .panel h2{margin:0 0 14px;font-size:16px;color:var(--cyan)}
  .row{margin-bottom:12px}
  .row label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
  .row input[type=text],.row input[type=password],.row select,.row textarea{width:100%;background:var(--bg);border:1px solid var(--line);
    color:var(--text);font-family:inherit;font-size:13px;padding:8px 10px;border-radius:6px}
  .row textarea{min-height:80px;resize:vertical}
  .row input:focus,.row textarea:focus,.row select:focus{outline:none;border-color:var(--green)}
  .row.inline{display:flex;align-items:center;gap:10px}
  .row.inline input{width:auto}
  .hint{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:4px}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .sect{border-top:1px solid var(--line);margin:16px 0 12px;padding-top:14px;font-size:13px;color:var(--green)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0f1a24;border:1px solid var(--line);
    padding:9px 18px;border-radius:8px;font-size:13px;display:none;z-index:30}
  .toast.on{display:block}
  .warn{color:var(--orange)}
  @media(max-width:600px){ .msg{max-width:96%} header h1{font-size:16px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>N5000 AI</h1>
    <span class="badge"><span class="dot" id="dot"></span><span id="modelName">DeepSeek</span></span>
    <span class="spacer"></span>
    <button id="lang" title="Language">EN</button>
    <button id="clearBtn" data-i18n="clear">清空</button>
    <button id="setBtn" data-i18n="settings">设置</button>
    <button id="backBtn" data-i18n="back">返回仪表盘</button>
  </header>

  <div id="chat"></div>
  <div class="typing" id="typing">AI 思考中…</div>

  <div class="inputbar">
    <textarea id="input" rows="1" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button class="primary" id="send" data-i18n="send">发送</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="panel">
    <h2 data-i18n="settingsTitle">AI 设置</h2>
    <div class="row">
      <label data-i18n="apiBase">API 地址（OpenAI 兼容）</label>
      <input type="text" id="cfgBase" placeholder="https://api.deepseek.com">
      <div class="hint" data-i18n="apiBaseHint">DeepSeek 填 https://api.deepseek.com；其它服务填各自的 /v1 地址</div>
    </div>
    <div class="row">
      <label data-i18n="apiKey">API Key</label>
      <input type="password" id="cfgKey" placeholder="sk-...">
      <div class="hint" id="keyHint">已保存的 Key 不会显示，留空表示不修改</div>
    </div>
    <div class="row">
      <label data-i18n="model">模型</label>
      <input type="text" id="cfgModel" placeholder="deepseek-chat">
    </div>
    <div class="row">
      <label data-i18n="sysPrompt">系统提示词</label>
      <textarea id="cfgPrompt"></textarea>
    </div>
    <div class="row inline">
      <input type="checkbox" id="cfgTools">
      <label style="margin:0" data-i18n="allowTools">允许 AI 执行路由器操作（重启 / 重启 WiFi / 改 WiFi 密码）</label>
    </div>
    <div class="row inline">
      <input type="checkbox" id="cfgEnabled">
      <label style="margin:0" data-i18n="enableAi">启用 AI 助手</label>
    </div>

    <div class="sect" data-i18n="wechatSect">微信机器人（公众号回调）</div>
    <div class="row">
      <label data-i18n="wxToken">公众号 Token（服务器配置里的 Token）</label>
      <input type="password" id="cfgWxToken" placeholder="Token">
    </div>
    <div class="row">
      <label data-i18n="wxUrl">公众号服务器 URL（填到微信后台）</label>
      <input type="text" id="cfgWxUrl" readonly>
      <div class="hint" data-i18n="wxUrlHint">需要在微信公众平台「服务器配置」里填写此 URL；本机没有公网 IP 时需用内网穿透（详见 README）</div>
    </div>

    <div class="actions">
      <button id="cancelBtn" data-i18n="cancel">取消</button>
      <button class="primary" id="saveBtn" data-i18n="save">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var T = {
    zh:{ clear:"清空", settings:"设置", back:"返回仪表盘", settingsTitle:"AI 设置", apiBase:"API 地址（OpenAI 兼容）",
      apiBaseHint:"DeepSeek 填 https://api.deepseek.com", apiKey:"API Key", model:"模型", sysPrompt:"系统提示词",
      allowTools:"允许 AI 执行路由器操作（重启 / 重启 WiFi / 改 WiFi 密码）", enableAi:"启用 AI 助手",
      wechatSect:"微信机器人（公众号回调）", wxToken:"公众号 Token（服务器配置里的 Token）",
      wxUrl:"公众号服务器 URL（填到微信后台）", wxUrlHint:"需要在微信公众平台「服务器配置」里填写此 URL；本机没有公网 IP 时需用内网穿透（详见 README）",
      save:"保存", cancel:"取消", send:"发送", thinking:"AI 思考中…", welcome:"你好，我是 N5000 路由器 AI 助手。可以问我路由器状态、网络问题，或让我重启设备/改 WiFi 密码。",
      needKey:"还没有配置 API Key，点右上角「设置」填写。", sendFail:"发送失败：", empty:"说点什么吧", saved:"已保存", cleared:"已清空对话", copy:"复制" },
    en:{ clear:"Clear", settings:"Settings", back:"Dashboard", settingsTitle:"AI Settings", apiBase:"API Base (OpenAI compatible)",
      apiBaseHint:"DeepSeek: https://api.deepseek.com", apiKey:"API Key", model:"Model", sysPrompt:"System prompt",
      allowTools:"Allow AI to control router (reboot / restart WiFi / change WiFi password)", enableAi:"Enable AI assistant",
      wechatSect:"WeChat Bot (Official Account callback)", wxToken:"WeChat Token (from server config)",
      wxUrl:"Callback URL (put into WeChat backend)", wxUrlHint:"Fill this URL in WeChat MP server config; needs a public URL (tunnel required if no public IP)",
      save:"Save", cancel:"Cancel", send:"Send", thinking:"AI is thinking…", welcome:"Hi, I am the N5000 router AI assistant. Ask me about router status or network issues, or let me reboot / change WiFi password.",
      needKey:"No API key configured. Open Settings to add one.", sendFail:"Request failed: ", empty:"Say something", saved:"Saved", cleared:"Chat cleared", copy:"Copy" }
  };
  var lang = localStorage.getItem('n5000-ai-lang') || 'zh';
  function t(k){ return (T[lang] && T[lang][k]) || T.zh[k] || k; }

  var history = [];
  var busy = false;
  var cfg = {};

  function applyLang(){
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    $('lang').textContent = lang === 'zh' ? 'EN' : '中';
    document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.getAttribute('data-i18n')); });
    $('typing').textContent = t('thinking');
    $('input').placeholder = lang === 'zh' ? '问点什么…（Enter 发送，Shift+Enter 换行）' : 'Ask anything… (Enter to send, Shift+Enter for newline)';
  }
  function toast(msg){
    var el = $('toast');
    el.textContent = msg; el.classList.add('on');
    clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('on'); }, 2200);
  }
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function addMsg(role, text, meta){
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + (role === 'user' ? 'me' : 'ai');
    var av = document.createElement('div'); av.className='avatar'; av.textContent = role === 'user' ? '你' : 'AI';
    var b = document.createElement('div');
    var bubble = document.createElement('div'); bubble.className='bubble'; bubble.textContent = text;
    b.appendChild(bubble);
    if (meta) { var m = document.createElement('div'); m.className='meta'; m.textContent = meta; b.appendChild(m); }
    wrap.appendChild(av); wrap.appendChild(b);
    $('chat').appendChild(wrap);
    $('chat').scrollTop = $('chat').scrollHeight;
    return bubble;
  }

  function loadConfig(){
    return fetch('/cgi-bin/aichat?action=config', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
      cfg = j || {};
      $('cfgBase').value = cfg.api_base || '';
      $('cfgModel').value = cfg.model || '';
      $('cfgPrompt').value = cfg.system_prompt || '';
      $('cfgTools').checked = !!cfg.allow_tools;
      $('cfgEnabled').checked = cfg.enabled !== false;
      $('modelName').textContent = cfg.model || 'DeepSeek';
      $('dot').className = 'dot' + (cfg.has_key && cfg.enabled !== false ? '' : ' off');
      $('cfgWxUrl').value = location.origin + '/cgi-bin/wechat';
    }).catch(function(){});
  }

  function sendChat(){
    if (busy) return;
    var text = $('input').value.trim();
    if (!text) { toast(t('empty')); return; }
    $('input').value = ''; $('input').style.height = 'auto';
    addMsg('user', text);
    history.push({role:'user', content:text});
    busy = true; $('send').disabled = true; $('typing').classList.add('on');
    fetch('/cgi-bin/aichat?action=chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({messages: history.slice(-20)})
    }).then(function(r){ return r.json(); }).then(function(j){
      $('typing').classList.remove('on');
      if (j && j.code === 0) {
        addMsg('ai', j.reply, j.tools ? ('tools:' + j.tools) : '');
        history.push({role:'assistant', content:j.reply});
      } else {
        addMsg('ai', (j && j.error) || 'error', '');
      }
    }).catch(function(e){
      $('typing').classList.remove('on');
      addMsg('ai', t('sendFail') + e.message, '');
    }).finally(function(){
      busy = false; $('send').disabled = false; $('input').focus();
    });
  }

  function saveConfig(){
    var data = {
      api_base: $('cfgBase').value.trim(),
      model: $('cfgModel').value.trim(),
      system_prompt: $('cfgPrompt').value,
      allow_tools: $('cfgTools').checked,
      enabled: $('cfgEnabled').checked
    };
    var key = $('cfgKey').value.trim();
    if (key) data.api_key = key;
    fetch('/cgi-bin/aichat?action=config', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)
    }).then(function(r){ return r.json(); }).then(function(j){
      if (j && j.code === 0) { toast(t('saved')); $('cfgKey').value=''; $('mask').classList.remove('on'); loadConfig(); }
      else toast('保存失败');
    }).catch(function(){ toast('保存失败'); });
  }

  /* events */
  $('lang').addEventListener('click', function(){ lang = lang === 'zh' ? 'en' : 'zh'; localStorage.setItem('n5000-ai-lang', lang); applyLang(); });
  $('setBtn').addEventListener('click', function(){ $('mask').classList.add('on'); });
  $('cancelBtn').addEventListener('click', function(){ $('mask').classList.remove('on'); });
  $('saveBtn').addEventListener('click', saveConfig);
  $('backBtn').addEventListener('click', function(){ location.href = '/dashboard.html'; });
  $('clearBtn').addEventListener('click', function(){ history = []; $('chat').innerHTML=''; addMsg('ai', t('welcome')); toast(t('cleared')); });
  $('send').addEventListener('click', sendChat);
  $('input').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });
  $('input').addEventListener('input', function(){ this.style.height='auto'; this.style.height = Math.min(this.scrollHeight,140)+'px'; });

  applyLang();
  addMsg('ai', t('welcome'));
  loadConfig();
})();
</script>
</body>
</html>
