<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>N5000 AI</title>
<style>
  :root{
    --text:#eef4ff; --dim:rgba(226,236,255,.62);
    --mint:#4C7DFF; --cyan:#7FA8FF; --amber:#ffc46b; --rose:#ff7f9c; --violet:#b49bff;
    --stroke:rgba(255,255,255,.17); --stroke-soft:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--text);
    font-family:"SF Pro Display","Segoe UI Variable","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .bg{position:fixed;inset:0;z-index:-2;background:
      radial-gradient(1200px 800px at 12% 8%, #1b3a5c 0%, transparent 60%),
      radial-gradient(1000px 700px at 88% 12%, #3a2260 0%, transparent 62%),
      radial-gradient(1200px 900px at 70% 95%, #0f4a4a 0%, transparent 60%),
      radial-gradient(900px 700px at 20% 90%, #241a45 0%, transparent 65%),
      linear-gradient(160deg,#0a0f18 0%,#0b1220 45%,#0a0d16 100%)}
  
  
  
  @keyframes float1{from{transform:translate3d(0,0,0)}to{transform:translate3d(6vw,4vh,0) scale(1.12)}}
  @keyframes float2{from{transform:translate3d(0,0,0) scale(1.05)}to{transform:translate3d(-5vw,-4vh,0) scale(.95)}}
  
  .wrap{height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:12px 18px;margin:14px 16px 6px;flex-wrap:wrap;
    border-radius:999px;border:1px solid var(--stroke);
    background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
    box-shadow:0 12px 34px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.28)}
  header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.4px;
    background:linear-gradient(100deg,#9FB9FF,#7FA8FF 55%,#b49bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;)}
  .badge{display:flex;align-items:center;font-size:12px;color:var(--dim);border:1px solid var(--stroke-soft);
    padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.06)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);display:inline-block;margin-right:6px;
    box-shadow:0 0 10px var(--mint)}
  .dot.off{background:var(--rose);box-shadow:0 0 10px var(--rose)}
  header .spacer{flex:1}
  .hbtn{color:var(--text);text-decoration:none;font-size:12.5px;padding:6px 14px;border-radius:999px;
    background:rgba(255,255,255,.08);border:1px solid var(--stroke-soft);cursor:pointer;
    transition:all .25s ease;font-family:inherit}
  .hbtn:hover{background:rgba(255,255,255,.16);border-color:var(--stroke);transform:translateY(-1px)}
  #chat{flex:1;overflow-y:auto;padding:14px 20px 6px;display:flex;flex-direction:column;gap:14px}
  #chat::-webkit-scrollbar{width:6px}
  #chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
  .msg{display:flex;gap:10px;max-width:min(860px,92%)}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .avatar{width:34px;height:34px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:600;border:1px solid var(--stroke-soft);
    background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
  .msg.ai .avatar{color:var(--mint);border-color:rgba(76,125,255,.4);box-shadow:0 0 18px rgba(76,125,255,.15)}
  .msg.me .avatar{color:var(--cyan);border-color:rgba(111,214,255,.4)}
  .bubble{padding:11px 15px;border-radius:20px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;
    background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.04));
    box-shadow:0 14px 34px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.26)}
  .msg.me .bubble{border-color:rgba(111,214,255,.34);background:linear-gradient(145deg,rgba(111,214,255,.16),rgba(111,214,255,.05))}
  .meta{font-size:11px;color:var(--dim);margin-top:5px}
  .inputbar{display:flex;gap:10px;padding:10px 16px 16px;align-items:flex-end}
  #input{flex:1;background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.035));
    border:1px solid var(--stroke);color:var(--text);font-family:inherit;font-size:14px;
    border-radius:22px;padding:12px 18px;resize:none;min-height:46px;max-height:140px;line-height:1.45;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 10px 26px rgba(0,0,0,.28)}
  #input:focus{outline:none;border-color:rgba(76,125,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 0 3px rgba(76,125,255,.12),0 10px 26px rgba(0,0,0,.28)}
  #send{height:46px;padding:0 22px;border:none;border-radius:999px;font-family:inherit;font-size:14px;font-weight:600;
    color:#052018;background:linear-gradient(120deg,#6F97FF,#4C7DFF 45%,#7FA8FF);cursor:pointer;
    box-shadow:0 10px 26px rgba(76,125,255,.28), inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .2s ease, filter .2s ease}
  #send:hover{transform:translateY(-1px);filter:brightness(1.06)}
  #send:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .typing{font-size:12.5px;color:var(--dim);padding:0 24px 6px;display:none}
  .typing.on{display:block}
  /* modal */
  .mask.on{display:flex}
  .panel{width:min(720px,96vw);max-height:88vh;overflow-y:auto;border-radius:26px;padding:22px;
    border:1px solid var(--stroke);
    background:linear-gradient(150deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
    box-shadow:0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.3)}
  .panel h2{margin:0 0 16px;font-size:16px;font-weight:600;
    background:linear-gradient(100deg,#9FB9FF,#7FA8FF);-webkit-background-clip:text;background-clip:text;color:transparent}
  .row{margin-bottom:14px}
  .row label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;letter-spacing:.3px}
  .row input[type=text],.row input[type=password],.row select,.row textarea{width:100%;color:var(--text);font-family:inherit;
    font-size:13px;padding:10px 14px;border-radius:14px;border:1px solid var(--stroke);
  .row textarea{min-height:84px;resize:vertical}
  .row input:focus,.row textarea:focus{outline:none;border-color:rgba(76,125,255,.5)}
  .row.inline{display:flex;align-items:center;gap:10px}
  .row.inline input{width:auto;accent-color:#4C7DFF}
  .hint{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:6px}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .actions button{border-radius:999px;padding:9px 20px;font-family:inherit;font-size:13px;cursor:pointer;
    border:1px solid var(--stroke-soft);background:rgba(255,255,255,.08);color:var(--text);transition:all .2s}
  .actions button:hover{background:rgba(255,255,255,.16)}
  .actions button.primary{border:none;color:#052018;font-weight:600;
    background:linear-gradient(120deg,#6F97FF,#4C7DFF 45%,#7FA8FF);
    box-shadow:0 10px 24px rgba(76,125,255,.26), inset 0 1px 0 rgba(255,255,255,.55)}
  .sect{border-top:1px solid var(--stroke-soft);margin:18px 0 14px;padding-top:16px;font-size:13px;color:var(--mint);letter-spacing:.4px}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);padding:10px 22px;border-radius:999px;
    font-size:13px;display:none;z-index:30;color:var(--text);
    box-shadow:0 16px 40px rgba(0,0,0,.4)}
  .toast.on{display:block}
  @media(max-width:600px){
    header{margin:10px 10px 4px;padding:10px 14px;gap:8px}
    header h1{font-size:16px}
    .hbtn{padding:5px 10px;font-size:12px}
    .msg{max-width:96%}
    #chat{padding:10px 12px 4px}
    .inputbar{padding:8px 10px 12px}
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <header>
    <h1>N5000 AI</h1>
    <span class="badge"><span class="dot" id="dot"></span><span id="modelName">DeepSeek</span></span>
    <span class="spacer"></span>
    <button id="lang" class="hbtn" title="Language">EN</button>
    <button id="clearBtn" class="hbtn" data-i18n="clear">清空</button>
    <button id="setBtn" class="hbtn" data-i18n="settings">设置</button>
    <button id="backBtn" class="hbtn" data-i18n="back">返回仪表盘</button>
  </header>

  <div id="chat"></div>
  <div class="typing" id="typing">AI 思考中…</div>

  <div class="inputbar">
    <textarea id="input" rows="1" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send" data-i18n="send">发送</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="panel">
    <h2 data-i18n="settingsTitle">AI 设置</h2>
    <div class="row">
      <label data-i18n="apiBase">API 地址（OpenAI 兼容）</label>
      <input type="text" id="cfgBase" placeholder="https://api.deepseek.com">
      <div class="hint" data-i18n="apiBaseHint">DeepSeek 填 https://api.deepseek.com；其它服务填各自的地址</div>
    </div>
    <div class="row">
      <label data-i18n="apiKey">API Key</label>
      <input type="password" id="cfgKey" placeholder="sk-...">
      <div class="hint">已保存的 Key 不会显示，留空表示不修改</div>
    </div>
    <div class="row">
      <label data-i18n="model">模型</label>
      <input type="text" id="cfgModel" placeholder="deepseek-chat">
    </div>
    <div class="row">
      <label data-i18n="sysPrompt">系统提示词</label>
      <textarea id="cfgPrompt"></textarea>
    </div>
    <div class="row inline">
      <input type="checkbox" id="cfgTools">
      <label style="margin:0" data-i18n="allowTools">允许 AI 执行路由器操作（重启 / 重启 WiFi / 改 WiFi 密码）</label>
    </div>
    <div class="row inline">
      <input type="checkbox" id="cfgEnabled">
      <label style="margin:0" data-i18n="enableAi">启用 AI 助手</label>
    </div>

    <div class="sect" data-i18n="wechatSect">微信机器人（公众号回调）</div>
    <div class="row">
      <label data-i18n="wxToken">公众号 Token（服务器配置里的 Token）</label>
      <input type="password" id="cfgWxToken" placeholder="Token">
    </div>
    <div class="row">
      <label data-i18n="wxUrl">公众号服务器 URL（填到微信后台）</label>
      <input type="text" id="cfgWxUrl" readonly>
      <div class="hint" data-i18n="wxUrlHint">需要在微信公众平台「服务器配置」里填写此 URL；本机没有公网 IP 时需用内网穿透</div>
    </div>

    <div class="actions">
      <button id="cancelBtn" data-i18n="cancel">取消</button>
      <button class="primary" id="saveBtn" data-i18n="save">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var T = {
    zh:{ clear:"清空", settings:"设置", back:"返回仪表盘", settingsTitle:"AI 设置", apiBase:"API 地址（OpenAI 兼容）",
      apiBaseHint:"DeepSeek 填 https://api.deepseek.com", apiKey:"API Key", model:"模型", sysPrompt:"系统提示词",
      allowTools:"允许 AI 执行路由器操作（重启 / 重启 WiFi / 改 WiFi 密码）", enableAi:"启用 AI 助手",
      wechatSect:"微信机器人（公众号回调）", wxToken:"公众号 Token（服务器配置里的 Token）",
      wxUrl:"公众号服务器 URL（填到微信后台）", wxUrlHint:"需要在微信公众平台「服务器配置」里填写此 URL；本机没有公网 IP 时需用内网穿透",
      save:"保存", cancel:"取消", send:"发送", thinking:"AI 思考中…", welcome:"你好，我是 N5000 路由器 AI 助手。可以问我路由器状态、网络问题，或让我重启设备/改 WiFi 密码。",
      needKey:"还没有配置 API Key，点右上角「设置」填写。", sendFail:"发送失败：", empty:"说点什么吧", saved:"已保存", cleared:"已清空对话" },
    en:{ clear:"Clear", settings:"Settings", back:"Dashboard", settingsTitle:"AI Settings", apiBase:"API Base (OpenAI compatible)",
      apiBaseHint:"DeepSeek: https://api.deepseek.com", apiKey:"API Key", model:"Model", sysPrompt:"System prompt",
      allowTools:"Allow AI to control router (reboot / restart WiFi / change WiFi password)", enableAi:"Enable AI assistant",
      wechatSect:"WeChat Bot (Official Account callback)", wxToken:"WeChat Token (from server config)",
      wxUrl:"Callback URL (put into WeChat backend)", wxUrlHint:"Fill this URL in WeChat MP server config; needs a public URL (tunnel required if no public IP)",
      save:"Save", cancel:"Cancel", send:"Send", thinking:"AI is thinking…", welcome:"Hi, I am the N5000 router AI assistant. Ask me about router status or network issues, or let me reboot / change WiFi password.",
      needKey:"No API key configured. Open Settings to add one.", sendFail:"Request failed: ", empty:"Say something", saved:"Saved", cleared:"Chat cleared" }
  };
  var lang = localStorage.getItem('n5000-ai-lang') || (navigator.language && navigator.language.indexOf('zh') === 0 ? 'zh' : 'en');
  function t(k){ return (T[lang] && T[lang][k]) || T.zh[k] || k; }

  var history = [];
  var busy = false;
  var cfg = {};

  function applyLang(){
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    $('lang').textContent = lang === 'zh' ? 'EN' : '中';
    document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.getAttribute('data-i18n')); });
    $('typing').textContent = t('thinking');
    $('input').placeholder = lang === 'zh' ? '问点什么…（Enter 发送，Shift+Enter 换行）' : 'Ask anything… (Enter to send, Shift+Enter for newline)';
  }
  function toast(msg){
    var el = $('toast');
    el.textContent = msg; el.classList.add('on');
    clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('on'); }, 2200);
  }
  function addMsg(role, text, meta){
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + (role === 'user' ? 'me' : 'ai');
    var av = document.createElement('div'); av.className='avatar'; av.textContent = role === 'user' ? (lang==='zh'?'你':'YOU') : 'AI';
    var b = document.createElement('div');
    var bubble = document.createElement('div'); bubble.className='bubble'; bubble.textContent = text;
    b.appendChild(bubble);
    if (meta) { var m = document.createElement('div'); m.className='meta'; m.textContent = meta; b.appendChild(m); }
    wrap.appendChild(av); wrap.appendChild(b);
    $('chat').appendChild(wrap);
    $('chat').scrollTop = $('chat').scrollHeight;
    return bubble;
  }

  function loadConfig(){
    return fetch('/cgi-bin/aichat?action=config', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
      cfg = j || {};
      $('cfgBase').value = cfg.api_base || '';
      $('cfgModel').value = cfg.model || '';
      $('cfgPrompt').value = cfg.system_prompt || '';
      $('cfgTools').checked = !!cfg.allow_tools;
      $('cfgEnabled').checked = cfg.enabled !== false;
      $('modelName').textContent = cfg.model || 'DeepSeek';
      $('dot').className = 'dot' + (cfg.has_key && cfg.enabled !== false ? '' : ' off');
      $('cfgWxUrl').value = location.origin + '/cgi-bin/wechat';
    }).catch(function(){});
  }

  function sendChat(){
    if (busy) return;
    var text = $('input').value.trim();
    if (!text) { toast(t('empty')); return; }
    $('input').value = ''; $('input').style.height = 'auto';
    addMsg('user', text);
    history.push({role:'user', content:text});
    busy = true; $('send').disabled = true; $('typing').classList.add('on');
    fetch('/cgi-bin/aichat?action=chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({messages: history.slice(-20)})
    }).then(function(r){ return r.json(); }).then(function(j){
      $('typing').classList.remove('on');
      if (j && j.code === 0) {
        addMsg('ai', j.reply, j.tools ? ('tools:' + j.tools) : '');
        history.push({role:'assistant', content:j.reply});
      } else {
        addMsg('ai', (j && j.error) || 'error', '');
      }
    }).catch(function(e){
      $('typing').classList.remove('on');
      addMsg('ai', t('sendFail') + e.message, '');
    }).finally(function(){
      busy = false; $('send').disabled = false; $('input').focus();
    });
  }

  function saveConfig(){
    var data = {
      api_base: $('cfgBase').value.trim(),
      model: $('cfgModel').value.trim(),
      system_prompt: $('cfgPrompt').value,
      allow_tools: $('cfgTools').checked,
      enabled: $('cfgEnabled').checked
    };
    var key = $('cfgKey').value.trim();
    if (key) data.api_key = key;
    fetch('/cgi-bin/aichat?action=config', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)
    }).then(function(r){ return r.json(); }).then(function(j){
      if (j && j.code === 0) { toast(t('saved')); $('cfgKey').value=''; $('mask').classList.remove('on'); loadConfig(); }
      else toast('保存失败');
    }).catch(function(){ toast('保存失败'); });
  }

  $('lang').addEventListener('click', function(){ lang = lang === 'zh' ? 'en' : 'zh'; localStorage.setItem('n5000-ai-lang', lang); applyLang(); });
  $('setBtn').addEventListener('click', function(){ $('mask').classList.add('on'); });
  $('cancelBtn').addEventListener('click', function(){ $('mask').classList.remove('on'); });
  $('saveBtn').addEventListener('click', saveConfig);
  $('backBtn').addEventListener('click', function(){ location.href = '/dashboard.html'; });
  $('clearBtn').addEventListener('click', function(){ history = []; $('chat').innerHTML=''; addMsg('ai', t('welcome')); toast(t('cleared')); });
  $('send').addEventListener('click', sendChat);
  $('input').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });
  $('input').addEventListener('input', function(){ this.style.height='auto'; this.style.height = Math.min(this.scrollHeight,140)+'px'; });

  applyLang();
  addMsg('ai', t('welcome'));
  loadConfig();
})();
</script>
</body>
</html>
