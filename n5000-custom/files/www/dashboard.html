<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N5000 Dashboard</title>
<link rel="icon" type="image/png" href="/luci-static/n5000/mascot-64.png">
<style>
:root{
  --text:#C8F4F9; --dim:rgba(200,244,249,.55);
  --card:rgba(255,255,255,.045);
  --border:rgba(255,255,255,.085);
  --accent:#48A9C5; --accent2:#83D9DC;
  --warn:#ffc46b; --bad:#ff7f9c;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--text);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 520px at 18% -12%, rgba(13,44,84,.30), transparent 60%),
    radial-gradient(900px 480px at 88% -8%, rgba(30,91,140,.20), transparent 58%),
    radial-gradient(900px 700px at 60% 110%, rgba(13,44,84,.14), transparent 60%),
    linear-gradient(180deg,#061428 0%,#0D2C54 55%,#071a30 100%);
}
.wrap{height:100vh;max-width:1680px;margin:0 auto;display:flex;flex-direction:column;padding:20px 26px;gap:16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:2px 2px 14px;border-bottom:1px solid var(--border)}
header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px;color:var(--text)}
header .sub{color:var(--dim);font-size:12.5px}
.clock{margin-left:auto;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.hbtn{color:var(--text);text-decoration:none;font-size:12.5px;padding:6px 13px;border-radius:8px;
  border:1px solid var(--border);background:rgba(255,255,255,.03);cursor:pointer;font-family:inherit;
  transition:background .18s ease, border-color .18s ease}
.hbtn:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16)}
#aiBtn{color:var(--accent);border-color:rgba(72,169,197,.35)}
#aiBtn:hover{background:rgba(72,169,197,.12)}
.grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(0,1fr);gap:14px;min-height:0}
.card{position:relative;display:flex;flex-direction:column;gap:5px;min-height:0;overflow:hidden;backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
  padding:17px 19px;border-radius:var(--radius);
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.028));
  border:1px solid var(--border)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 45%)}
.card.wide{grid-column:span 2}
.label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
.big{font-size:33px;font-weight:600;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big.sm{font-size:21px}
.unit{font-size:12px;color:var(--dim);font-weight:500;margin-left:5px}
.row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:3px 10px;border-radius:6px;color:var(--dim);
  background:rgba(255,255,255,.035);border:1px solid var(--border)}
.ok{color:var(--accent)}.warn{color:var(--warn)}.bad{color:var(--bad)}.info{color:var(--accent2)}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:auto}
.bar > i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .45s ease}
.mini{font-size:12px;color:var(--dim);line-height:1.55}
.val{font-size:16.5px;font-weight:600;font-variant-numeric:tabular-nums}
canvas.spark{width:100%;height:100%;min-height:66px;display:block}
.spark-wrap{flex:1;min-height:76px;position:relative}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
.err{position:fixed;left:50%;top:12px;transform:translateX(-50%);color:#ffd9e3;font-size:12.5px;display:none;
  padding:8px 16px;border-radius:8px;border:1px solid rgba(255,127,156,.4);background:rgba(255,127,156,.12);z-index:5}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr);grid-template-rows:auto}.card.wide{grid-column:span 2}}
@media(max-width:640px){.wrap{padding:12px;gap:12px}.grid{grid-template-columns:1fr;gap:10px}.card.wide{grid-column:span 1}.big{font-size:28px}}

</style>
</head>
<body class="logged-in">
<div class="bg"></div>
<div class="err" id="err">连接断开</div>
<div class="wrap">
  <header>
    <h1>N5000</h1>
    <span class="sub" id="sub">OpenWrt</span>
    <span class="clock" id="clock">--:--:--</span>
    <button id="lang" class="hbtn" title="切换语言 / Switch language">EN</button>
    
    <a href="/appfilter.html" class="hbtn" title="应用过滤 / App Filter">流量</a>
    <a href="/cgi-bin/luci/" class="hbtn" data-i18n="luci">进入 LuCI 管理 →</a>
  </header>

  <div class="grid">
    <div class="card">
      <div class="label" data-i18n="uptime">运行时间</div>
      <div class="big" id="uptime">--</div>
      <div class="mini" id="booted">--</div>
    </div>

    <div class="card">
      <div class="label" data-i18n="load">CPU 负载</div>
      <div class="row"><div class="big" id="load1">--</div><span class="unit" data-i18n="min1">1 分钟</span></div>
      <div class="mini" id="loadavg">--</div>
      <div class="bar"><i id="loadbar"></i></div>
    </div>

    <div class="card">
      <div class="label" data-i18n="temp">CPU 温度</div>
      <div class="row"><div class="big" id="temp">--</div><span class="unit">°C</span></div>
      <div class="mini" id="tempnote">--</div>
    </div>

    <div class="card">
      <div class="label" data-i18n="mem">内存</div>
      <div class="row"><div class="big" id="mem">--</div><span class="unit">%</span></div>
      <div class="mini" id="memnote">--</div>
      <div class="bar"><i id="membar"></i></div>
    </div>

    <div class="card wide">
      <div class="label"><span data-i18n="wan">WAN 实时流量</span> · <span id="wanip">--</span></div>
      <div class="row" style="gap:24px">
        <div><span class="dot" style="background:var(--mint);color:var(--mint)"></span><b class="val" id="down">0.00</b><span class="unit" data-i18n="down">Mbps 下行</span></div>
        <div><span class="dot" style="background:var(--cyan);color:var(--cyan)"></span><b class="val" id="up">0.00</b><span class="unit" data-i18n="up">Mbps 上行</span></div>
        <div class="mini" id="total" style="margin-left:auto">--</div>
      </div>
      <div class="spark-wrap"><canvas class="spark" id="spark"></canvas></div>
    </div>

    <div class="card">
      <div class="label" data-i18n="tf">TF 卡存储</div>
      <div class="row"><div class="big" id="tf">--</div><span class="unit">%</span></div>
      <div class="mini" id="tfnote">--</div>
      <div class="bar"><i id="tfbar"></i></div>
    </div>

    <div class="card wide">
      <div class="label" data-i18n="wifi">WiFi（MT7992）</div>
      <div class="row">
        <div class="big" id="clients">--</div><span class="unit" data-i18n="online">台设备在线</span>
        <span class="chip" id="ssid">SSID --</span>
      </div>
      <div class="mini" id="laninfo">--</div>
    </div>

    <div class="card">
      <div class="label">PassWall</div>
      <div class="row"><div class="big sm" id="pw">--</div></div>
      <div class="mini" id="pwnote">--</div>
    </div>

    <div class="card">
      <div class="label">Docker</div>
      <div class="row"><div class="big sm" id="docker">--</div></div>
      <div class="mini" id="dockernote">--</div>
    </div>

    <div class="card">
      <div class="label" data-i18n="modem">5G 模组</div>
      <div class="row"><div class="big sm" id="modem">--</div></div>
      <div class="mini" id="modemnote">--</div>
    </div>

    <div class="card">
      <div class="label" data-i18n="health">TF 卡健康</div>
      <div class="row"><div class="big sm" id="errs">--</div></div>
      <div class="mini" id="errsnote">--</div>
    </div>
  </div>
</div>


<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };

  var T = {
    zh: {
      luci: "进入 LuCI 管理 →", uptime: "运行时间", load: "CPU 负载", min1: "1 分钟",
      temp: "CPU 温度", mem: "内存", wan: "WAN 实时流量", down: "Mbps 下行", up: "Mbps 上行",
      tf: "TF 卡存储", wifi: "WiFi（MT7992）", online: "台设备在线", modem: "5G 模组",
      health: "TF 卡健康",
      booted: "开机于 ", used: "已用 ", swap: "Swap ", total: "累计 ↓", lan: "LAN ",
      running: "运行中", stopped: "未运行", enabled_on: "已启用 · 代理已接管流量", disabled: "未启用",
      containers: "容器 ", containers_unit: " 个 · 数据目录 /mnt/sda1/docker",
      no_usb: "未连接 USB 盘或未启动", connected: "已连接", notfound: "未检测到",
      modem_off: "USB 口无 5G 模组", modem_ip: "USB 5G 模组 IP ",
      err_bad: "内核检测到 I/O 错误，请检查 TF 卡", err_ok: "无 I/O 错误 · ",
      temp_ok: "温度正常", temp_warn: "温度正常偏高", temp_bad: "温度偏高",
      units: ["天", "小时", "分"], day: " 天 ", hour: " 小时 ", minute: " 分 ",
      disconn: "与路由器连接断开，正在重试…", d5: "5 分钟 ", d15: " · 15 分钟 "
    },
    en: {
      luci: "Open LuCI →", uptime: "Uptime", load: "CPU Load", min1: "1 min",
      temp: "CPU Temp", mem: "Memory", wan: "WAN Traffic", down: "Mbps Down", up: "Mbps Up",
      tf: "TF Card Storage", wifi: "WiFi (MT7992)", online: "clients online", modem: "5G Modem",
      health: "TF Health",
      booted: "Booted ", used: "Used ", swap: "Swap ", total: "Total ↓", lan: "LAN ",
      running: "Running", stopped: "Stopped", enabled_on: "Enabled · proxying traffic", disabled: "Disabled",
      containers: "Containers ", containers_unit: " · data dir /mnt/sda1/docker",
      no_usb: "No USB disk / not started", connected: "Connected", notfound: "Not detected",
      modem_off: "No 5G modem on USB", modem_ip: "5G modem IP ",
      err_bad: "Kernel I/O errors detected, check TF card", err_ok: "No I/O errors · ",
      temp_ok: "Normal", temp_warn: "Warm", temp_bad: "Hot",
      units: ["d", "h", "m"], day: "d ", hour: "h ", minute: "m ",
      disconn: "Disconnected from router, retrying…", d5: "5m ", d15: " · 15m "
    }
  };

  var lang = localStorage.getItem('n5000-lang') || (navigator.language && navigator.language.indexOf('zh') === 0 ? 'zh' : 'en');
  var prev = null, samples = [], MAX = 90, errTimer = 0, lastData = null;

  function t(k){ return T[lang][k] !== undefined ? T[lang][k] : T.zh[k]; }

  function applyLang(){
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    $('lang').textContent = lang === 'zh' ? 'EN' : '中';
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    $('err').textContent = t('disconn');
    if (lastData) render(lastData);
  }

  function fmtUptime(s){
    s = Math.max(0, Math.floor(s));
    var d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
    if (lang === 'zh') {
      if (d > 0) return d + t('day') + h + t('hour');
      if (h > 0) return h + t('hour') + m + t('minute');
      return m + t('minute');
    }
    if (d > 0) return d + 'd ' + h + 'h';
    if (h > 0) return h + 'h ' + m + 'm';
    return m + 'm';
  }
  function fmtGB(kb){ return (kb/1048576).toFixed(1); }
  function fmtTraffic(bytes){
    if (bytes > 1099511627776) return (bytes/1099511627776).toFixed(2) + " TB";
    if (bytes > 1073741824) return (bytes/1073741824).toFixed(2) + " GB";
    if (bytes > 1048576) return (bytes/1048576).toFixed(1) + " MB";
    return (bytes/1024).toFixed(0) + " KB";
  }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  function drawSpark(){
    var c = $("spark"); if (!c) return;
    var dpr = window.devicePixelRatio || 1;
    var w = c.clientWidth, h = c.clientHeight;
    if (!w || !h) return;
    if (c.width !== Math.round(w*dpr) || c.height !== Math.round(h*dpr)) {
      c.width = Math.round(w*dpr); c.height = Math.round(h*dpr);
    }
    var ctx = c.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle = "rgba(255,255,255,0.07)"; ctx.lineWidth = 1;
    for (var i=1;i<4;i++){ var y = h*i/4; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
    if (samples.length < 2) return;
    var maxV = 1;
    samples.forEach(function(s){ maxV = Math.max(maxV, s.down, s.up); });
    maxV = maxV * 1.2;
    function line(key, color, fill){
      ctx.beginPath();
      samples.forEach(function(s, idx){
        var x = idx / (MAX-1) * w;
        var y = h - (s[key]/maxV)*h*0.92 - 2;
        if (idx === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.strokeStyle = color; ctx.lineWidth = 2.2; ctx.lineJoin = "round"; ctx.stroke();
      if (fill){
        ctx.lineTo((samples.length-1)/(MAX-1)*w, h);
        ctx.lineTo(0, h); ctx.closePath();
        var g = ctx.createLinearGradient(0,0,0,h);
        g.addColorStop(0, fill); g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g; ctx.fill();
      }
    }
    line("down", "#48A9C5", "rgba(72,169,197,0.28)");
    line("up", "#83D9DC", null);
  }

  function render(d){
    lastData = d;
    $("sub").textContent = d.host || "OpenWrt";
    $("uptime").textContent = fmtUptime(d.uptime);
    $("booted").textContent = t('booted') + new Date((d.ts - d.uptime)*1000).toLocaleString(lang === 'zh' ? "zh-CN" : "en-US", {hour12:false});

    $("load1").textContent = Number(d.load[0]).toFixed(2);
    $("loadavg").textContent = t('d5') + Number(d.load[1]).toFixed(2) + t('d15') + Number(d.load[2]).toFixed(2);
    var lp = clamp(d.load[0]/2*100, 2, 100);
    $("loadbar").style.width = lp + "%";
    $("loadbar").style.background = d.load[0] > 1.5 ? "var(--rose)" : d.load[0] > 0.8 ? "var(--amber)" : "linear-gradient(90deg,var(--cyan),var(--violet))";

    var tv = d.temp/1000;
    $("temp").textContent = tv.toFixed(1);
    $("temp").className = "big " + (tv >= 80 ? "bad" : tv >= 65 ? "warn" : "ok");
    $("tempnote").textContent = tv >= 80 ? t('temp_bad') : tv >= 65 ? t('temp_warn') : t('temp_ok');

    var memUsed = d.mem_total - d.mem_avail;
    var mp = d.mem_total ? memUsed/d.mem_total*100 : 0;
    $("mem").textContent = mp.toFixed(0);
    $("mem").className = "big " + (mp >= 85 ? "bad" : mp >= 70 ? "warn" : "ok");
    var swapUsed = Math.max(0, d.swap_total - d.swap_free);
    $("memnote").textContent = t('used') + fmtGB(memUsed) + " / " + fmtGB(d.mem_total) + " GB · " + t('swap') + (swapUsed/1024).toFixed(1) + " GB";
    $("membar").style.width = mp + "%";
    $("membar").style.background = mp >= 85 ? "var(--rose)" : mp >= 70 ? "linear-gradient(90deg,var(--amber),var(--rose))" : "linear-gradient(90deg,var(--mint),var(--cyan))";

    var tp = d.tf_total ? d.tf_used/d.tf_total*100 : 0;
    $("tf").textContent = tp.toFixed(0);
    $("tf").className = "big " + (tp >= 90 ? "bad" : tp >= 75 ? "warn" : "ok");
    $("tfnote").textContent = t('used') + fmtGB(d.tf_used) + " / " + fmtGB(d.tf_total) + " GB";
    $("tfbar").style.width = tp + "%";
    $("tfbar").style.background = tp >= 90 ? "var(--rose)" : tp >= 75 ? "linear-gradient(90deg,var(--amber),var(--rose))" : "linear-gradient(90deg,var(--mint),var(--cyan))";

    $("wanip").textContent = d.wan_ip || "--";
    var down = 0, up = 0;
    if (prev && d.ts > prev.ts) {
      var dt = d.ts - prev.ts;
      down = Math.max(0, (d.wan_rx - prev.rx) * 8 / dt / 1e6);
      up   = Math.max(0, (d.wan_tx - prev.tx) * 8 / dt / 1e6);
    }
    prev = { ts: d.ts, rx: d.wan_rx, tx: d.wan_tx };
    $("down").textContent = down.toFixed(2);
    $("up").textContent = up.toFixed(2);
    $("total").textContent = t('total') + fmtTraffic(d.wan_rx) + " ↑" + fmtTraffic(d.wan_tx);

    samples.push({down: down, up: up});
    if (samples.length > MAX) samples.shift();
    drawSpark();

    $("clients").textContent = d.clients;
    $("ssid").textContent = "SSID " + d.ssid;
    $("laninfo").textContent = t('lan') + (d.lan_ip || "--") + " · " + t('total') + fmtTraffic(d.lan_rx) + " ↑" + fmtTraffic(d.lan_tx);

    $("pw").textContent = d.pw ? t('running') : t('stopped');
    $("pw").className = "big sm " + (d.pw ? "ok" : "bad");
    $("pwnote").textContent = Number(d.pw_enabled) === 1 ? t('enabled_on') : t('disabled');

    $("docker").textContent = d.docker ? t('running') : t('stopped');
    $("docker").className = "big sm " + (d.docker ? "ok" : "bad");
    $("dockernote").textContent = d.docker ? (t('containers') + d.docker_count + t('containers_unit')) : t('no_usb');

    $("modem").textContent = d.modem ? t('connected') : t('notfound');
    $("modem").className = "big sm " + (d.modem ? "ok" : "warn");
    $("modemnote").textContent = d.modem ? (t('modem_ip') + d.modem_ip) : t('modem_off');

    $("errs").textContent = d.errs;
    $("errs").className = "big sm " + (d.errs > 0 ? "bad" : "ok");
    $("errsnote").textContent = d.errs > 0 ? t('err_bad') : (t('err_ok') + (d.tf_model || "TF"));
  }

  function setClock(){
    var d = new Date();
    $("clock").textContent = String(d.getHours()).padStart(2,"0") + ":" +
      String(d.getMinutes()).padStart(2,"0") + ":" + String(d.getSeconds()).padStart(2,"0");
  }
  setInterval(setClock, 1000); setClock();

  $("lang").addEventListener('click', function(){
    lang = lang === 'zh' ? 'en' : 'zh';
    localStorage.setItem('n5000-lang', lang);
    applyLang();
  });

  function poll(){
    fetch("/cgi-bin/rstatus?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ $("err").style.display = "none"; errTimer = 0; render(d); })
      .catch(function(){ errTimer++; if (errTimer >= 2) $("err").style.display = "block"; });
  }
  applyLang();
  poll();
  setInterval(poll, 2000);
  window.addEventListener("resize", drawSpark);

})();
</script>
<script src="/luci-static/n5000/mascot.js"></script>
</body>
</html>
