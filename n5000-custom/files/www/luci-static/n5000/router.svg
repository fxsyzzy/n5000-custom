<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400">
  <defs>
    <!-- ins 风奶油白 / 雾霾蓝 -->
    <linearGradient id="topFace" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F2F8FB"/>
      <stop offset="100%" stop-color="#E3EFF5"/>
    </linearGradient>
    <linearGradient id="edgeFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D7E6EE"/>
      <stop offset="100%" stop-color="#BFD4DF"/>
    </linearGradient>
    <linearGradient id="sideFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9DAE4"/>
      <stop offset="100%" stop-color="#A9C2D0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DDF1F7" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#DDF1F7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#7FA3B5" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- 柔和背景光 -->
  <circle cx="282" cy="196" r="168" fill="url(#halo)"/>
  <circle cx="120" cy="120" r="5" fill="#D7E6EE"/>
  <circle cx="470" cy="96" r="4" fill="#D7E6EE"/>
  <circle cx="492" cy="284" r="6" fill="#E3EFF5"/>
  <circle cx="88" cy="300" r="4" fill="#E3EFF5"/>

  <!-- 底部投影 -->
  <ellipse cx="290" cy="322" rx="150" ry="16" fill="#9FB8C6" opacity=".38"/>

  <g filter="url(#soft)" transform="rotate(-7 280 210)">
    <!-- 机身厚度（右侧） -->
    <path d="M170 112 L420 112 Q436 112 436 128 L436 286 Q436 302 420 302 L186 302 Q170 302 170 286 Z"
          fill="url(#sideFace)"/>
    <!-- 顶面 -->
    <path d="M150 96 L400 96 Q422 96 422 118 L422 278 Q422 300 400 300 L170 300 Q148 300 148 278 L148 118 Q148 96 150 96 Z"
          fill="url(#topFace)" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="2"/>
    <!-- 顶面高光 -->
    <path d="M158 108 L412 108 L412 132 Q280 120 158 140 Z" fill="#FFFFFF" opacity=".65"/>
    <!-- 顶部细线装饰 -->
    <path d="M172 258 L398 258" stroke="#D7E6EE" stroke-width="2" stroke-linecap="round"/>

    <!-- 极简标识 -->
    <g transform="translate(285 196)">
      <text x="0" y="0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700"
            font-size="26" fill="#8FA9B8" letter-spacing="6">N5000</text>
      <g stroke="#A9C2D0" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".9">
        <path d="M-13 -22 a8 8 0 0 1 0 12"/>
        <path d="M-6 -28 a15 15 0 0 1 0 22"/>
      </g>
    </g>

    <!-- 前面黑色玻璃饰条 -->
    <rect x="178" y="264" width="212" height="16" rx="8" fill="#2B3B47" opacity=".92"/>
    <circle cx="376" cy="272" r="3" fill="#9FE3D0"/>

    <!-- 右侧接口 -->
    <g>
      <!-- RJ45 2.5G -->
      <rect x="422" y="150" width="16" height="20" rx="3" fill="#3A4A55"/>
      <rect x="424" y="154" width="12" height="4" rx="1" fill="#D9C28A"/>
      <!-- RJ45 2.5G -->
      <rect x="422" y="180" width="16" height="20" rx="3" fill="#3A4A55"/>
      <rect x="424" y="184" width="12" height="4" rx="1" fill="#D9C28A"/>
      <!-- USB-A -->
      <rect x="420" y="120" width="20" height="13" rx="3" fill="#3A4A55"/>
      <rect x="424" y="124" width="12" height="5" rx="1" fill="#8FA9B8"/>
      <!-- USB-C -->
      <rect x="426" y="104" width="10" height="6" rx="3" fill="#3A4A55"/>
      <!-- DC 供电 -->
      <circle cx="430" cy="240" r="6" fill="#3A4A55"/>
      <circle cx="430" cy="240" r="2.2" fill="#8FA9B8"/>
    </g>
  </g>

  <!-- 接口小标注（ins 风细线标签） -->
  <g font-family="Segoe UI, sans-serif" font-size="10.5" fill="#A9C2D0" letter-spacing=".5">
    <line x1="462" y1="118" x2="500" y2="118" stroke="#C9DAE4" stroke-width="1"/>
    <text x="504" y="121">USB</text>
    <line x1="462" y1="162" x2="500" y2="162" stroke="#C9DAE4" stroke-width="1"/>
    <text x="504" y="165">2.5G</text>
    <line x1="462" y1="192" x2="500" y2="192" stroke="#C9DAE4" stroke-width="1"/>
    <text x="504" y="195">2.5G</text>
    <line x1="462" y1="242" x2="500" y2="242" stroke="#C9DAE4" stroke-width="1"/>
    <text x="504" y="245">PD</text>
  </g>
</svg>
