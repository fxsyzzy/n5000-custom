<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#83D9DC"/>
      <stop offset="45%" stop-color="#48A9C5"/>
      <stop offset="100%" stop-color="#1E5B8C"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8F4F9"/>
      <stop offset="100%" stop-color="#83D9DC"/>
    </linearGradient>
    <linearGradient id="ant" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E5B8C"/>
      <stop offset="100%" stop-color="#0D2C54"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#83D9DC" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#0D2C54" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <ellipse cx="230" cy="150" rx="190" ry="110" fill="url(#glow)"/>
  <!-- 天线 -->
  <g fill="url(#ant)" stroke="#061428" stroke-width="2">
    <rect x="150" y="34" width="12" height="96" rx="6" transform="rotate(-9 156 130)"/>
    <rect x="182" y="24" width="12" height="104" rx="6" transform="rotate(-4 188 120)"/>
    <rect x="228" y="20" width="12" height="106" rx="6" transform="rotate(2 234 120)"/>
    <rect x="262" y="26" width="12" height="100" rx="6" transform="rotate(8 268 126)"/>
  </g>
  <!-- 机身阴影 -->
  <ellipse cx="230" cy="248" rx="128" ry="20" fill="#03101f" opacity=".55"/>
  <!-- 机身 -->
  <g filter="url(#soft)">
    <rect x="112" y="118" width="236" height="92" rx="16" fill="url(#body)" stroke="#C8F4F9" stroke-opacity=".5" stroke-width="1.6"/>
    <rect x="112" y="118" width="236" height="18" rx="9" fill="url(#top)" opacity=".85"/>
    <!-- 前面板 -->
    <rect x="132" y="146" width="120" height="38" rx="8" fill="#061428" opacity=".88"/>
    <text x="150" y="170" font-family="Consolas, monospace" font-size="17" fill="#C8F4F9" letter-spacing="1">N5000</text>
    <circle cx="300" cy="152" r="4" fill="#83D9DC"/>
    <circle cx="316" cy="152" r="4" fill="#48A9C5"/>
    <circle cx="332" cy="152" r="4" fill="#1E5B8C"/>
    <!-- 5G 标识 -->
    <text x="240" y="186" font-family="Segoe UI, sans-serif" font-weight="700" font-size="16" fill="#C8F4F9" text-anchor="middle" letter-spacing="2">2.5G</text>
  </g>
  <!-- LAN 标签 -->
  <g>
    <path d="M350 176 L400 176" stroke="#83D9DC" stroke-width="2.5" stroke-dasharray="3 4"/>
    <rect x="360" y="160" width="92" height="30" rx="15" fill="#061428" opacity=".9" stroke="#83D9DC" stroke-width="1.4"/>
    <text x="406" y="180" font-family="Segoe UI, sans-serif" font-size="12" fill="#C8F4F9" text-anchor="middle">LAN 2.5G</text>
  </g>
</svg>
