<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400">
  <g fill="#ffffff" stroke="#111111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- 机身厚度（右下） -->
    <path d="M150 250 L452 250 Q466 250 466 264 L466 288 Q466 302 452 302 L168 302 Q154 302 154 288 Z"/>
    <!-- 顶面 -->
    <path d="M176 108 L438 108 Q462 108 462 132 L462 240 Q462 264 438 264 L200 264 Q176 264 176 240 L176 132 Q176 108 176 108 Z"/>
    <!-- 前面板黑色饰条（线稿：内嵌矩形） -->
    <path d="M196 274 L438 274 Q446 274 446 280 Q446 288 438 288 L196 288 Q188 288 188 280 Q188 274 196 274 Z" fill="#ffffff"/>
    <rect x="206" y="278" width="220" height="6" rx="3" fill="none"/>
    <!-- 右侧接口：USB-C / USB-A / 2×RJ45 -->
    <g fill="#ffffff">
      <!-- USB-C -->
      <rect x="458" y="126" width="12" height="6" rx="3"/>
      <!-- USB-A -->
      <rect x="452" y="142" width="24" height="16" rx="3"/>
      <rect x="458" y="148" width="12" height="4" fill="none"/>
      <!-- RJ45 x2 -->
      <rect x="456" y="172" width="20" height="24" rx="3"/>
      <rect x="460" y="178" width="12" height="6" fill="none"/>
      <rect x="456" y="206" width="20" height="24" rx="3"/>
      <rect x="460" y="212" width="12" height="6" fill="none"/>
    </g>
    <!-- LED 指示灯 -->
    <circle cx="422" cy="281" r="2.4" fill="#111111" stroke="none"/>
    <!-- 顶面细节：极简品牌刻线 -->
    <path d="M292 186 L340 186" stroke-width="1.6" fill="none"/>
    <path d="M292 196 L320 196" stroke-width="1.2" fill="none" opacity="0.55"/>
  </g>
  <!-- WiFi 线稿波纹 -->
  <g fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round" opacity="0.55">
    <path d="M300 84 a40 40 0 0 1 60 0"/>
    <path d="M286 70 a62 62 0 0 1 88 0"/>
    <path d="M272 56 a84 84 0 0 1 116 0"/>
  </g>
</svg>
