<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 130" width="180" height="130">
  <style>
    .bob { animation: bob 3.2s ease-in-out infinite; transform-origin: 80px 70px; }
    @keyframes bob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(-2deg); }
    }
    .tail { animation: tail 1.6s ease-in-out infinite; transform-origin: 108px 70px; }
    @keyframes tail {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(7deg); }
    }
    .b1 { animation: rise1 4.2s linear infinite; }
    .b2 { animation: rise2 5.1s linear infinite; animation-delay: 1.2s; }
    .b3 { animation: rise3 4.6s linear infinite; animation-delay: 2.1s; }
    @keyframes rise1 { 0% { transform: translate(0,0); opacity: 0; } 20% { opacity: .85; } 100% { transform: translate(-14px,-46px); opacity: 0; } }
    @keyframes rise2 { 0% { transform: translate(0,0); opacity: 0; } 25% { opacity: .7; } 100% { transform: translate(-10px,-54px); opacity: 0; } }
    @keyframes rise3 { 0% { transform: translate(0,0); opacity: 0; } 25% { opacity: .6; } 100% { transform: translate(-18px,-40px); opacity: 0; } }
    .blink { animation: blink 5.5s infinite; transform-origin: 58px 56px; }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(.08); }
    }
  </style>
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6F97FF"/>
      <stop offset="55%" stop-color="#4C7DFF"/>
      <stop offset="100%" stop-color="#2B5BE8"/>
    </linearGradient>
    <linearGradient id="tailGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7FA8FF"/>
      <stop offset="100%" stop-color="#4C7DFF"/>
    </linearGradient>
  </defs>

  <!-- 气泡 -->
  <circle class="b1" cx="46" cy="46" r="5" fill="#9FB9FF" opacity="0"/>
  <circle class="b2" cx="34" cy="58" r="3.5" fill="#9FB9FF" opacity="0"/>
  <circle class="b3" cx="52" cy="34" r="4" fill="#9FB9FF" opacity="0"/>

  <g class="bob">
    <!-- 尾巴 -->
    <path class="tail" d="M112 70 L146 48 L138 70 L146 92 Z" fill="url(#tailGrad)"/>
    <!-- 背鳍 -->
    <path d="M66 40 Q80 22 96 38 Q82 36 74 46 Z" fill="#7FA8FF" opacity=".95"/>
    <!-- 身体 -->
    <ellipse cx="76" cy="70" rx="42" ry="29" fill="url(#bodyGrad)"/>
    <!-- 肚子高光 -->
    <ellipse cx="72" cy="80" rx="30" ry="15" fill="#A9C3FF" opacity=".38"/>
    <!-- 胸鳍 -->
    <path d="M80 78 Q92 94 70 92 Q78 86 80 78 Z" fill="#7FA8FF" opacity=".9"/>
    <!-- 眼睛 -->
    <g class="blink">
      <circle cx="58" cy="56" r="8.5" fill="#F4F8FF"/>
      <circle cx="56.5" cy="56" r="4.4" fill="#0B1220"/>
      <circle cx="54.8" cy="54.2" r="1.5" fill="#FFFFFF"/>
    </g>
    <!-- 嘴巴 -->
    <path d="M38 74 Q45 80 52 74" stroke="#0B1220" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55"/>
    <!-- 腮 -->
    <path d="M62 60 Q68 66 62 74" stroke="#2B5BE8" stroke-width="2" fill="none" opacity=".5" stroke-linecap="round"/>
  </g>
</svg>
