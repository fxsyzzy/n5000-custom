name: Inspect Firmware

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Download firmware artifact (run 45359624743 (v4))
        run: |
          curl -sSL -H "Authorization: Bearer ${{ github.token }}" \
            -o fw.zip \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/14917305286/zip"
          unzip -q fw.zip -d fw
          ls -l fw

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools device-tree-compiler > /dev/null
          unsquashfs -version | head -1

      - name: Unpack tar and examine
        run: |
          set -e
          cd fw
          BIN=$(ls *sysupgrade.bin)
          echo "=== bin: $BIN ==="
          tar -tf "$BIN"
          tar -xf "$BIN"
          cd sysupgrade-nradio_n5000
          echo "=== kernel magic ==="
          xxd -l 32 kernel
          echo "=== root magic ==="
          xxd -l 16 root
          echo "=== kernel FIT ==="
          dtc -I dtb -O dts kernel 2>/dev/null > /tmp/kernel.dts || true
          grep -E "description|compatible|model|bootargs|config" /tmp/kernel.dts | head -40
          echo "=== FIT structure ==="
          dtc -I dtb -O dts kernel 2>/dev/null | grep -E "^\s+(images|configurations|fdt|kernel)" | head -20

      - name: Rootfs checks
        run: |
          set -e
          cd fw/sysupgrade-nradio_n5000
          echo "=== total files ==="
          unsquashfs -l root | wc -l
          echo "=== preinit ==="
          unsquashfs -cat root lib/preinit/35_nradio_tf_overlay || echo "MISSING 35_nradio_tf_overlay"
          echo "=== board.d/02_network 断言 ==="
NETFILE=/tmp/netcheck
unsquashfs -cat root etc/board.d/02_network > $NETFILE 2>/dev/null || true
grep -q 'ucidef_set_interfaces_lan_wan "eth0" "eth1"' $NETFILE && echo "PASS: lan/wan block" || echo "FAIL: lan/wan block"
grep -q '. /lib/functions/nradio-n5000.sh' $NETFILE && echo "PASS: mac block" || echo "FAIL: mac block"
grep -q 'openembed,som7981' $NETFILE && echo "PASS: openembed intact" || echo "FAIL: openembed missing"
echo "n5000 blocks: $(grep -c 'nradio,n5000)' $NETFILE)"
wc -c $NETFILE
echo "=== board.d/02_network n5000 ==="
          unsquashfs -cat root etc/board.d/02_network 2>/dev/null | grep -A6 "nradio,n5000" || echo "MISSING board.d n5000"
          echo "=== etc/config/network ==="
          unsquashfs -cat root etc/config/network 2>/dev/null | head -60 || echo "MISSING network config"
          echo "=== uci-defaults list ==="
          unsquashfs -l root etc/uci-defaults | head -30
          echo "=== firmware dir ==="
          unsquashfs -l root lib/firmware 2>/dev/null | grep -iE "mt79|airoha|en8811| mediatek" | head -30
          echo "=== modules.d / wifi ==="
          unsquashfs -l root etc/modules.d 2>/dev/null | head -20
          echo "=== dashboard/theme files ==="
          unsquashfs -l root www 2>/dev/null | grep -iE "dashboard|rstatus|index" | head -10
          echo "=== nradio-n5000.sh ==="
          unsquashfs -cat root lib/functions/nradio-n5000.sh 2>/dev/null | head -40 || echo "MISSING nradio-n5000.sh"
          echo "=== platform.sh n5000 upgrade ==="
          unsquashfs -cat root lib/upgrade/platform.sh 2>/dev/null | grep -A8 "nradio,n5000" | head -30 || echo "MISSING platform upgrade"
          echo "=== check failsafe guard requirements ==="
          unsquashfs -cat root lib/preinit/35_nradio_tf_overlay 2>/dev/null | grep -E "factory-firmware|rootfs_data|FAILSAFE" || true

