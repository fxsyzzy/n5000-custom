name: Inspect Firmware

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Download v4 firmware artifact
        run: |
          curl -sSL -H "Authorization: Bearer ${{ github.token }}" \
            -o fw.zip \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/14917305286/zip"
          unzip -q fw.zip -d fw
          ls -l fw

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools device-tree-compiler > /dev/null

      - name: Unpack firmware
        run: |
          set -e
          cd fw
          BIN=$(ls *sysupgrade.bin)
          echo "BIN=$BIN"
          tar -xf "$BIN"
          cd sysupgrade-nradio_n5000
          echo "=== FIT summary ==="
          dtc -I dtb -O dts kernel 2>/dev/null | grep -E "description|config-1|fdt-1|kernel-1" | head -20

      - name: Rootfs verification
        run: |
          set -e
          cd fw/sysupgrade-nradio_n5000
          echo "=== file count ==="
          unsquashfs -l root | wc -l
          unsquashfs -cat root etc/board.d/02_network > /tmp/netcheck 2>/dev/null || true
          echo "=== 02_network assertions ==="
          grep -q 'ucidef_set_interfaces_lan_wan "eth0" "eth1"' /tmp/netcheck && echo "PASS: lan/wan block" || echo "FAIL: lan/wan block"
          grep -q '. /lib/functions/nradio-n5000.sh' /tmp/netcheck && echo "PASS: mac block" || echo "FAIL: mac block"
          grep -q 'openembed,som7981' /tmp/netcheck && echo "PASS: openembed intact" || echo "FAIL: openembed missing"
          echo "n5000 blocks: $(grep -c 'nradio,n5000)' /tmp/netcheck || true)"
          wc -c /tmp/netcheck
          echo "=== preinit ==="
          unsquashfs -l root lib/preinit 2>/dev/null | grep -c "35_nradio_tf_overlay" || echo "MISSING preinit"
          echo "=== uci-defaults count ==="
          unsquashfs -l root etc/uci-defaults 2>/dev/null | grep -c "99-zz-custom-branding" || echo "MISSING branding"
          echo "=== dashboard files ==="
          unsquashfs -l root www 2>/dev/null | grep -E "dashboard.html|rstatus" | head -5
          echo "=== themes/passwall/docker in manifest ==="
          for p in luci-theme-argon luci-theme-carbon luci-app-passwall luci-app-dockerman luci-app-adblock; do
            unsquashfs -l root usr/lib/opkg/info 2>/dev/null | grep -q "$p.control" && echo "PASS: $p" || echo "FAIL: $p"
          done
          echo "=== wifi SSID defaults ==="
          unsquashfs -cat root etc/board.d/06-nradio-n5000-wifi 2>/dev/null | grep -iE "ssid|NRadio|OpenWrt" | head -5 || true
