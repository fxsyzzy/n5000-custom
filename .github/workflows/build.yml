name: N5000 Custom OpenWrt Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext \
            git libncurses-dev libssl-dev python3 python3-setuptools rsync swig \
            unzip zlib1g-dev file wget xsltproc ccache time
          df -h /

      - name: 克隆 OpenWrt 源码
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git log -1 --format='%H %s'

      - name: 添加第三方 feed（Argon / Carbon / PassWall）
        run: |
          cd openwrt
          {
            echo ""
            echo "src-git argon https://github.com/jerrykuku/luci-theme-argon.git;master"
            echo "src-git carbon https://github.com/mrjoechen/luci-theme-carbon.git;main"
            echo "src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main"
            echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main"
          } >> feeds.conf.default
          cat feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 注入 N5000 板级支持
        run: python3 board/apply.py openwrt

      - name: 应用定制配置
        run: |
          cp configs/n5000-custom.config openwrt/.config
          cd openwrt
          make defconfig

      - name: 注入自定义文件（Docker / Swap / 去标识 / 仪表盘）
        run: |
          mkdir -p openwrt/files
          cp -a files/. openwrt/files/
          chmod +x openwrt/files/etc/init.d/* \
                   openwrt/files/etc/uci-defaults/* \
                   openwrt/files/etc/hotplug.d/block/20-n5000-docker \
                   openwrt/files/www/cgi-bin/rstatus \
                   openwrt/files/usr/sbin/theme
          find openwrt/files -type f -exec ls -l {} \;

      - name: 下载软件包源码
        run: |
          cd openwrt
          make -j"$(nproc)" download || make -j"$(nproc)" download

      - name: 编译固件
        run: |
          cd openwrt
          set -o pipefail
          make -j"$(nproc)" V=s > /tmp/build.log 2>&1 || {
            echo "===== 编译失败，日志尾部 ====="
            tail -n 400 /tmp/build.log
            exit 1
          }
          tail -n 50 /tmp/build.log

      - name: 收集产物
        if: success()
        run: |
          mkdir -p out
          cp -v openwrt/bin/targets/mediatek/filogic/*nradio_n5000*sysupgrade.bin out/ || true
          cp -v openwrt/bin/targets/mediatek/filogic/*nradio_n5000.manifest out/ || true
          cp -v openwrt/bin/targets/mediatek/filogic/profiles.json out/ || true
          cd out
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: n5000-custom-firmware
          path: out/

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
